<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirShare - Secure File Transfer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 440px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .pin-box {
            display: none;
            background: #eff6ff;
            border: 1px border var(--primary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 16px;
        }

        .pin-number {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--primary);
            margin: 8px 0;
        }

        .countdown-timer {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--danger);
            margin-top: 6px;
        }

        .expired-msg {
            color: var(--danger);
            font-weight: 700;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AirShare</h1>
    <p class="subtitle">Ephemeral 6-digit PIN file transfer</p>

    <!-- Send File Section -->
    <div class="section">
        <label for="fileInput">Upload File</label>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Generate Security PIN</button>

        <div id="pinBox" class="pin-box">
            <div style="font-size: 0.85rem; color: var(--muted);">YOUR 6-DIGIT SECURITY PIN</div>
            <div id="pinDisplay" class="pin-number">------</div>
            <div id="timerDisplay" class="countdown-timer">Expiring in 30s</div>
        </div>
    </div>

    <!-- Receive File Section -->
    <div class="section">
        <label for="pinInput">Download File</label>
        <input type="text" id="pinInput" placeholder="Enter 6-digit PIN" maxlength="6">
        <button onclick="downloadFile()">Download File</button>
    </div>
</div>

<script>
    let countdownInterval;

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) {
            alert('Please select a file to upload.');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                displayPinAndStartTimer(data.pin, data.expiresInSeconds);
            } else {
                alert(data.message || 'Upload failed.');
            }
        } catch (error) {
            alert('An error occurred while uploading the file.');
        }
    }

    function displayPinAndStartTimer(pin, durationSeconds) {
        const pinBox = document.getElementById('pinBox');
        const pinDisplay = document.getElementById('pinDisplay');
        const timerDisplay = document.getElementById('timerDisplay');

        pinBox.style.display = 'block';
        pinDisplay.innerText = pin;

        let timeRemaining = durationSeconds;
        timerDisplay.innerHTML = `Expiring in <strong>${timeRemaining}s</strong>`;

        clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            timeRemaining--;

            if (timeRemaining > 0) {
                timerDisplay.innerHTML = `Expiring in <strong>${timeRemaining}s</strong>`;
            } else {
                clearInterval(countdownInterval);
                pinDisplay.innerText = '------';
                timerDisplay.className = 'expired-msg';
                timerDisplay.innerText = '⚠️ PIN Expired! File permanently deleted.';
            }
        }, 1000);
    }

    function downloadFile() {
        const pin = document.getElementById('pinInput').value.trim();
        if (pin.length !== 6 || isNaN(pin)) {
            alert('Please enter a valid 6-digit PIN.');
            return;
        }

        // Trigger file download request
        window.location.href = `/download/${pin}`;
    }
</script>

</body>
</html>
