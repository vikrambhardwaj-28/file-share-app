<script>
    let selectedFile = null;
    let countdownInterval;

    function handleFormatSelect(e) {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            document.getElementById('selectedFileInfo').style.display = 'block';
            document.getElementById('fmtFileName').innerText = selectedFile.name;
        }
    }

    function startFormatProcess() {
        if (!selectedFile) return alert('Please select a file to convert.');
        
        const targetFormat = document.getElementById('targetFormatSelect').value;
        const formData = new FormData();
        formData.append('files', selectedFile);
        formData.append('targetFormat', targetFormat); // Send target format to server

        const progressWrapper = document.getElementById('progressWrapper');
        const progressBarFill = document.getElementById('progressBarFill');
        const uploadPercent = document.getElementById('uploadPercent');

        progressWrapper.style.display = 'block';
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/format', true);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBarFill.style.width = percent + '%';
                uploadPercent.innerText = percent + '%';
            }
        };

        xhr.onload = function() {
            progressWrapper.style.display = 'none';
            if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                if (data.success) {
                    displayFormatResults(data.pin, data.expiresInSeconds);
                }
            } else {
                alert('Format conversion failed.');
            }
        };
        xhr.send(formData);
    }

    function displayFormatResults(pin, durationSeconds) {
        document.getElementById('emptyPlaceholder').style.display = 'none';
        document.getElementById('resultBox').style.display = 'block';

        const targetFmt = document.getElementById('targetFormatSelect').value;
        document.getElementById('resTargetFmt').innerText = targetFmt;

        const nameParts = selectedFile.name.split('.');
        nameParts.pop();
        const convertedName = nameParts.join('.') + '.' + targetFmt;

        const downloadUrl = `/download/${pin}/0`;
        const dBtn = document.getElementById('directDownloadBtn');
        dBtn.href = downloadUrl;
        dBtn.download = convertedName;

        document.getElementById('pinDisplay').innerText = pin;
        document.getElementById('qrcode').innerHTML = '';
        new QRCode(document.getElementById('qrcode'), { text: `${window.location.origin}/index.html?pin=${pin}`, width: 110, height: 110 });

        let timeLeft = durationSeconds;
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) document.getElementById('timerDisplay').innerText = `Expiring in ${timeLeft}s`;
            else { clearInterval(countdownInterval); document.getElementById('pinDisplay').innerText = '------'; document.getElementById('timerDisplay').innerText = '⚠️ PIN Expired!'; }
        }, 1000);
    }
</script>
